# Cap the journal. The systemd default allows up to 10% of the filesystem,
# subject to a 4G default cap; on a 58G eMMC root the journal reached 3.8G.
#
# Expressed as a smaller percentage so one shared value scales to each machine's
# disk rather than being tuned for the smallest one. See docs/disk-space.md.
[Journal]
SystemMaxUse=2%
SystemMaxFileSize=100M
