# AeroSpace — Hyprland-parity config
#
# Keybinds mirror dot-config/hypr/hyprland/binds.conf with `alt` standing in for
# Hyprland's SUPER. On a Mac keyboard Option sits in the same physical position
# as SUPER does on a PC keyboard, and using it avoids fighting macOS's cmd
# shortcuts (cmd+Q/W/H/Space all keep working).
#
# Deliberate divergences from Hyprland are marked "NOTE:" below.
# Docs: https://nikitabobko.github.io/AeroSpace/guide

after-login-command = []

after-startup-command = [
  # Catppuccin Mocha borders. Hyprland uses border_size = 2 with a mauve->pink
  # gradient on active groups; `borders` gets the closest equivalent.
  'exec-and-forget borders active_color=gradient(top_left=0xffcba6f7,bottom_right=0xfff5c2e7) inactive_color=0xff45475a width=2.0',
  'exec-and-forget sketchybar',
]

exec-on-workspace-change = [
  '/bin/bash', '-c', 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Hyprland uses gaps_in = 5 (between windows) and gaps_out = 15 (screen edge).
# AeroSpace's inner gap is the full gap between two windows, so it is 2 * gaps_in.
# outer.top leaves room for sketchybar (32px bar + 10px breathing room); the
# built-in display keeps a tight gap because the bar sits in the notch area.
[gaps]
inner.horizontal = 10
inner.vertical =   10
outer.left =       15
outer.bottom =     15
outer.top =        [{ monitor."^built-in retina display$" = 15 }, 42]
outer.right =      15

[mode.main.binding]

# --- Layout -----------------------------------------------------------------
# Hyprland: SUPER+P togglesplit, SUPER+F fullscreen, SUPER+V togglefloating,
#           SUPER+G togglegroup
alt-p = 'layout tiles horizontal vertical'
alt-f = 'fullscreen'
alt-v = 'layout floating tiling'
alt-g = 'layout accordion tiles'
alt-comma = 'layout accordion horizontal vertical'
alt-w = 'close'

# NOTE: Hyprland's SUPER+CTRL+h/l cycles the active window inside a group.
# AeroSpace's closest analog is moving focus within an accordion container.
alt-ctrl-h = 'focus left'
alt-ctrl-l = 'focus right'

# NOTE: Hyprland has no keyboard resize binds (mouse only, and AeroSpace cannot
# bind SUPER+drag). These fill that gap.
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'
alt-shift-0 = 'balance-sizes'

# --- Focus / move -----------------------------------------------------------
# Hyprland: SUPER+h/j/k/l movefocus, SUPER+SHIFT+h/j/k/l movewindoworgroup
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- Applications -----------------------------------------------------------
# Hyprland: SUPER+Q terminal, SUPER+Return browser, SUPER+E files,
#           SUPER+T btop, SUPER+D lazydocker, SUPER+slash 1Password
alt-q = "exec-and-forget open -na Ghostty"
alt-enter = "exec-and-forget open -n -a 'Google Chrome'"
alt-e = 'exec-and-forget open -a Finder'
alt-t = "exec-and-forget open -na Ghostty --args -e btop"
alt-d = "exec-and-forget open -na Ghostty --args -e lazydocker"
alt-slash = 'exec-and-forget open -a 1Password'

# Hyprland: SUPER+SHIFT+B opens Basecamp as a Chrome app window.
alt-shift-b = 'exec-and-forget open -a Basecamp'

# Headphones (Hyprland: SUPER+SHIFT+CTRL+H via bluetoothctl)
alt-ctrl-shift-h = 'exec-and-forget blueutil --connect 04-00-6e-d6-e3-59'

# --- Shell surfaces ---------------------------------------------------------
# Hyprland routes these to Quickshell over its `global` IPC; on macOS the
# sketchybar popups and helper scripts stand in.
alt-b = 'exec-and-forget sketchybar --set bluetooth popup.drawing=toggle'
alt-n = 'exec-and-forget sketchybar --set wifi popup.drawing=toggle'

# Lock and power menu (Hyprland: SUPER+ESC hyprlock, SUPER+SHIFT/CTRL+ESC menu)
alt-esc = 'exec-and-forget pmset displaysleepnow'
alt-shift-esc = 'exec-and-forget sketchybar --set power popup.drawing=toggle'
alt-ctrl-esc = 'exec-and-forget sketchybar --set power popup.drawing=toggle'

# NOTE: alt-space (launcher) and alt-shift-c (clipboard history) are NOT bound
# here. Raycast grabs its own hotkeys at the system level, so binding them in
# AeroSpace would only shadow Raycast. Configure them in Raycast's settings --
# see docs/macos-desktop.md.

# --- Workspaces -------------------------------------------------------------
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = ['move-node-to-workspace 1', 'exec-and-forget sketchybar --trigger aerospace_window_moved']
alt-shift-2 = ['move-node-to-workspace 2', 'exec-and-forget sketchybar --trigger aerospace_window_moved']
alt-shift-3 = ['move-node-to-workspace 3', 'exec-and-forget sketchybar --trigger aerospace_window_moved']
alt-shift-4 = ['move-node-to-workspace 4', 'exec-and-forget sketchybar --trigger aerospace_window_moved']
alt-shift-5 = ['move-node-to-workspace 5', 'exec-and-forget sketchybar --trigger aerospace_window_moved']
alt-shift-6 = ['move-node-to-workspace 6', 'exec-and-forget sketchybar --trigger aerospace_window_moved']
alt-shift-7 = ['move-node-to-workspace 7', 'exec-and-forget sketchybar --trigger aerospace_window_moved']
alt-shift-8 = ['move-node-to-workspace 8', 'exec-and-forget sketchybar --trigger aerospace_window_moved']
alt-shift-9 = ['move-node-to-workspace 9', 'exec-and-forget sketchybar --trigger aerospace_window_moved']

# Scratchpad. AeroSpace has no special workspaces, so `aerospace-scratchpad`
# emulates Hyprland's togglespecialworkspace: summon the named workspace onto
# the focused monitor, or bounce back to the previous one if already there.
# Hyprland: SUPER+S / SUPER+SHIFT+S -> special:magic
#
# exec-and-forget runs without a shell and with a minimal PATH that excludes
# ~/.local/bin, so route through zsh. ~/.zshenv is sourced for every zsh
# invocation, which is what puts the dotfiles bin dirs on PATH.
alt-s = 'exec-and-forget /bin/zsh -c "aerospace-scratchpad toggle magic"'
alt-shift-s = ['move-node-to-workspace magic', 'exec-and-forget sketchybar --trigger aerospace_window_moved']

# NOTE: Hyprland binds SUPER+TAB to the special:typingmind workspace, which is a
# Linux-only app deck. Keeping back-and-forth here instead.
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

# NOTE: screenshots stay on the native macOS bindings (cmd+shift+3/4/5) rather
# than emulating hyprshot. Hyprland's screen-recording binds have no equivalent.

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
5 = 'secondary'
6 = 'secondary'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.superduper.superwhisper'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.cockos.LICEcap'
run = 'layout floating'

# Hyprland floats these dialog-style surfaces via windowrule; same intent here.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = 'Info$'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = '^YouTube Music$'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.todoist.mac.Todoist'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.basecamp.basecamp3'
run = 'move-node-to-workspace 4'
