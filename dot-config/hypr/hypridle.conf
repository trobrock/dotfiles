general {
  ignore_wayland_inhibit = true
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
  timeout = 150 # 2.5min
  on-timeout = brightnessctl -s set 10 && brightnessctl -sd chromeos::kbd_backlight set 0
  on-resume = brightnessctl -r && brightnessctl -rd chromeos::kbd_backlight
}

listener {
  timeout = 300 # 5min
  on-timeout = loginctl lock-session
}

listener {
  timeout = 330 # 5.5min
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r
}

listener {
  timeout = 1800 # 30min
  on-timeout = ~/.config/scripts/suspend-then-hibernate-on-battery
}
